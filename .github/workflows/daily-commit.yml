name: Daily Commit

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create/Update daily log
        run: |
          mkdir -p logs
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H:%M:%S)
          FILENAME="logs/daily-log-${DATE}.md"
          cat >> "$FILENAME" << EOF
          # Daily Log - $DATE
          Time: $TIME UTC
          Status: ✅ Completed
          EOF
      
      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add logs/
            git commit -m "chore: daily automated log - $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
