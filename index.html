<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Flow Pro - Visual Logic Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        canvas: '#18181b', // zinc-900
                        panel: '#27272a',  // zinc-800
                        accent: '#8b5cf6', // violet-500
                        wire: '#71717a'    // zinc-500
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; user-select: none; background-color: #18181b;}

        /* Canvas & Transformations */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #18181b;
            cursor: grab;
        }
        #viewport:active { cursor: grabbing; }
        
        #workspace {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: 0 0; /* Critical for zooming */
            will-change: transform;
        }

        /* Dynamic Grid Background - applied to workspace so it scales */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            width: 10000px; /* Arbitrary large size for panning */
            height: 10000px;
            position: absolute;
            left: -5000px; top: -5000px; /* Center it */
            pointer-events: none;
        }

        /* Node Elements */
        .node {
            position: absolute;
            width: 260px;
            background: #27272a;
            border-radius: 0.5rem;
            border: 1px solid #3f3f46;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            cursor: default;
            z-index: 10;
        }
        
        .node-header { cursor: grab; }
        .node-header:active { cursor: grabbing; }
        
        .node.selected {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3), 0 10px 15px -3px rgba(0,0,0,0.5);
            z-index: 15;
        }
        
        .node.executing {
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        /* Ports */
        .port {
            width: 12px; height: 12px;
            background: #27272a;
            border: 2px solid #71717a;
            border-radius: 50%;
            position: absolute;
            cursor: crosshair;
            z-index: 20;
            transition: all 0.15s;
        }
        .port:hover { background: #8b5cf6; border-color: white; transform: scale(1.3); }
        .port.connected { background: #10b981; border-color: #059669; }
        .port-in { left: -6px; top: 50%; transform: translateY(-50%); }
        .port-out { right: -6px; top: 50%; transform: translateY(-50%); }

        /* SVG Wiring */
        .svg-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; overflow: visible;
        }
        .wire-path {
            fill: none; stroke: #52525b; stroke-width: 3; stroke-linecap: round;
            pointer-events: visibleStroke; cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        .wire-path:hover { stroke: #ef4444; stroke-width: 5; }
        
        @keyframes flowPulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
        .wire-path.executing {
            stroke: #10b981; stroke-dasharray: 12; animation: flowPulse 0.5s linear infinite;
        }

        /* Custom Context Menu */
        #context-menu {
            position: fixed; display: none; z-index: 100;
            background: #27272a; border: 1px solid #3f3f46;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            border-radius: 0.375rem; padding: 0.25rem; min-width: 160px;
        }
        .context-item {
            padding: 0.5rem 0.75rem; font-size: 0.875rem; color: #e4e4e7;
            cursor: pointer; border-radius: 0.25rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .context-item:hover { background: #3f3f46; color: white; }
    </style>
</head>
<body class="text-gray-200 flex flex-col h-screen w-screen overflow-hidden bg-canvas">

    <!-- Top Toolbar -->
    <header class="h-12 bg-panel border-b border-zinc-700 flex justify-between items-center px-4 z-40 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-6 h-6 rounded bg-accent flex items-center justify-center shadow-lg shadow-violet-500/20">
                <i class="ph ph-git-merge text-white text-sm"></i>
            </div>
            <h1 class="font-bold text-sm tracking-wide text-white">Nexus Flow <span class="text-zinc-400 font-normal">Pro Engine</span></h1>
        </div>
        
        <div class="flex items-center gap-4 text-xs font-mono text-zinc-400">
            <span id="coord-display">X: 0, Y: 0, Z: 100%</span>
            <div class="h-4 w-px bg-zinc-600"></div>
            <button id="btn-center" class="hover:text-white transition-colors" title="Center Canvas (Home)"><i class="ph ph-corners-out text-lg"></i></button>
            <button id="btn-clear" class="hover:text-red-400 transition-colors" title="Clear Canvas"><i class="ph ph-trash text-lg"></i></button>
            <button id="btn-run" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-medium transition-colors flex items-center gap-1">
                <i class="ph ph-play text-sm"></i> Execute
            </button>
        </div>
    </header>

    <!-- Main App Area -->
    <main class="flex-1 flex relative overflow-hidden">
        
        <!-- Left Sidebar: Library -->
        <aside class="w-64 bg-panel border-r border-zinc-700 flex flex-col z-30 shrink-0">
            <div class="p-3 text-xs font-semibold text-zinc-500 uppercase tracking-wider border-b border-zinc-700">Nodes</div>
            <div class="p-3 space-y-2 overflow-y-auto flex-1" id="node-library">
                <!-- Populated by JS -->
            </div>
            <div class="p-3 border-t border-zinc-700 text-xs text-zinc-500 bg-zinc-800/50">
                <ul class="list-disc pl-4 space-y-1">
                    <li>Drag nodes to canvas</li>
                    <li>Middle-click/Space drag to pan</li>
                    <li>Scroll to zoom</li>
                    <li>Right-click for context menu</li>
                </ul>
            </div>
        </aside>

        <!-- Center Viewport (Canvas) -->
        <div id="viewport" class="flex-1">
            <div id="workspace">
                <div class="bg-grid"></div>
                <svg id="svg-layer" class="svg-canvas"></svg>
                <div id="node-layer" class="absolute inset-0"></div>
            </div>
        </div>

        <!-- Right Sidebar: Console/Properties -->
        <aside class="w-72 bg-panel border-l border-zinc-700 flex flex-col z-30 shrink-0">
            <!-- Properties Tab -->
            <div class="h-1/2 border-b border-zinc-700 flex flex-col">
                <div class="p-3 text-xs font-semibold text-zinc-500 uppercase tracking-wider border-b border-zinc-700 flex justify-between">
                    Properties <span id="prop-id" class="font-mono text-zinc-600"></span>
                </div>
                <div id="properties-content" class="p-4 flex-1 overflow-y-auto space-y-3">
                    <div class="text-sm text-zinc-500 italic text-center mt-4">Select a node to inspect.</div>
                </div>
            </div>
            
            <!-- Execution Console Tab -->
            <div class="h-1/2 flex flex-col bg-black/20">
                <div class="p-3 text-xs font-semibold text-zinc-500 uppercase tracking-wider border-b border-zinc-700 flex justify-between items-center">
                    Console Output
                    <button id="btn-clear-console" class="text-zinc-500 hover:text-white"><i class="ph ph-eraser"></i></button>
                </div>
                <div id="console-output" class="p-3 flex-1 overflow-y-auto font-mono text-xs space-y-1 text-zinc-300">
                    <div class="text-zinc-600">System initialized. Ready.</div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Context Menu -->
    <div id="context-menu">
        <!-- Injected dynamically -->
    </div>

    <script>
        
        // --- 1. System Configuration & Registry ---
        const NODE_REGISTRY = {
            'trigger': { category: 'Events', title: 'Start Trigger', color: 'bg-emerald-500', icon: 'ph-play-circle', ports: ['out'], 
                execute: (node, ctx) => { return { timestamp: Date.now(), status: 'started' }; } 
            },
            'string': { category: 'Data', title: 'String Value', color: 'bg-blue-500', icon: 'ph-quotes', ports: ['out'], 
                state: { value: 'Hello World' },
                renderProps: (node, update) => `<label class="text-xs text-zinc-400">Value</label><input type="text" value="${node.state.value}" onchange="update('${node.id}', 'value', this.value)" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 text-sm mt-1 focus:border-accent outline-none">`,
                execute: (node, ctx) => { return node.state.value; }
            },
            'number': { category: 'Data', title: 'Number Value', color: 'bg-blue-500', icon: 'ph-hash', ports: ['out'], 
                state: { value: 10 },
                renderProps: (node, update) => `<label class="text-xs text-zinc-400">Value</label><input type="number" value="${node.state.value}" onchange="update('${node.id}', 'value', parseFloat(this.value))" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 text-sm mt-1 focus:border-accent outline-none">`,
                execute: (node, ctx) => { return node.state.value; }
            },
            'math': { category: 'Logic', title: 'Math Operation', color: 'bg-violet-500', icon: 'ph-calculator', ports: ['in', 'out'], 
                state: { operation: 'multiply', factor: 2 },
                renderProps: (node, update) => `
                    <label class="text-xs text-zinc-400">Operation</label>
                    <select onchange="update('${node.id}', 'operation', this.value)" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 text-sm mt-1 mb-2 outline-none focus:border-accent">
                        <option value="multiply" ${node.state.operation === 'multiply'?'selected':''}>Multiply</option>
                        <option value="add" ${node.state.operation === 'add'?'selected':''}>Add</option>
                    </select>
                    <label class="text-xs text-zinc-400">Factor/Operand</label>
                    <input type="number" value="${node.state.factor}" onchange="update('${node.id}', 'factor', parseFloat(this.value))" class="w-full bg-zinc-900 border border-zinc-600 rounded px-2 py-1 text-sm mt-1 focus:border-accent outline-none">
                `,
                execute: (node, ctx, inputData) => { 
                    const val = parseFloat(inputData) || 0;
                    return node.state.operation === 'multiply' ? val * node.state.factor : val + node.state.factor;
                }
            },
            'log': { category: 'Output', title: 'Log to Console', color: 'bg-zinc-500', icon: 'ph-terminal', ports: ['in'], 
                execute: (node, ctx, inputData) => { App.log(`[${node.title}] ${JSON.stringify(inputData)}`, 'text-emerald-400'); return inputData; }
            }
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const lerp = (start, end, amt) => (1 - amt) * start + amt * end;

        // --- 2. State Manager (Local Storage Persistence) ---
        class Store {
            static save(graphData) {
                localStorage.setItem('nexusFlow_v2', JSON.stringify(graphData));
                App.log('State saved automatically.', 'text-zinc-500');
            }
            static load() {
                const data = localStorage.getItem('nexusFlow_v2');
                return data ? JSON.parse(data) : null;
            }
            static clear() {
                localStorage.removeItem('nexusFlow_v2');
            }
        }

        
        // --- 3. Canvas & Viewport Controller ---
        class CanvasController {
            constructor() {
                this.viewport = document.getElementById('viewport');
                this.workspace = document.getElementById('workspace');
                this.coordDisplay = document.getElementById('coord-display');
                
                this.transform = { x: 0, y: 0, scale: 1 };
                this.isPanning = false;
                this.startPan = { x: 0, y: 0 };
                
                this.initEvents();
                this.updateTransform();
            }

            initEvents() {
                // Panning (Middle click or Space+Click)
                this.viewport.addEventListener('mousedown', (e) => {
                    // Middle button (1) or Spacebar held (simulated via boolean if implemented)
                    if (e.button === 1 || e.altKey) { 
                        e.preventDefault();
                        this.isPanning = true;
                        this.startPan = { x: e.clientX - this.transform.x, y: e.clientY - this.transform.y };
                        this.viewport.style.cursor = 'grabbing';
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.isPanning) return;
                    this.transform.x = e.clientX - this.startPan.x;
                    this.transform.y = e.clientY - this.startPan.y;
                    this.updateTransform();
                });

                window.addEventListener('mouseup', (e) => {
                    if(this.isPanning) {
                        this.isPanning = false;
                        this.viewport.style.cursor = 'grab';
                        App.graph.triggerSave();
                    }
                });

                // Zooming (Wheel)
                this.viewport.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if(e.ctrlKey) return; // Ignore browser zoom
                    
                    const zoomSensitivity = 0.001;
                    const delta = e.deltaY * -zoomSensitivity;
                    const newScale = Math.min(Math.max(0.2, this.transform.scale * (1 + delta)), 3); // Clamped 0.2x to 3x

                    // Math to zoom towards mouse cursor
                    const rect = this.viewport.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    this.transform.x = mouseX - (mouseX - this.transform.x) * (newScale / this.transform.scale);
                    this.transform.y = mouseY - (mouseY - this.transform.y) * (newScale / this.transform.scale);
                    this.transform.scale = newScale;
                    
                    this.updateTransform();
                    App.graph.triggerSave();
                });
            }

            updateTransform() {
                this.workspace.style.transform = `translate(${this.transform.x}px, ${this.transform.y}px) scale(${this.transform.scale})`;
                this.coordDisplay.textContent = `X: ${Math.round(this.transform.x)}, Y: ${Math.round(this.transform.y)}, Z: ${Math.round(this.transform.scale * 100)}%`;
            }

            center() {
                this.transform = { x: 0, y: 0, scale: 1 };
                this.updateTransform();
            }

            // Convert screen coordinates to workspace coordinates
            screenToWorld(clientX, clientY) {
                const rect = this.viewport.getBoundingClientRect();
                return {
                    x: (clientX - rect.left - this.transform.x) / this.transform.scale,
                    y: (clientY - rect.top - this.transform.y) / this.transform.scale
                };
            }
        }

        
        // --- 4. Graph Architecture ---
        class GraphManager {
            constructor() {
                this.nodes = [];
                this.edges = [];
                this.selectedNodeId = null;
                
                // DOM Layers
                this.nodeLayer = document.getElementById('node-layer');
                this.svgLayer = document.getElementById('svg-layer');
                this.propsContainer = document.getElementById('properties-content');
                this.propId = document.getElementById('prop-id');
                
                // Interaction State
                this.draggingNode = null;
                this.dragOffset = {x:0, y:0};
                
                this.wiring = { active: false, sourceNode: null, tempPath: null };
                
                this.bindEvents();
            }

            // --- Serialization ---
            toJSON() {
                return {
                    nodes: this.nodes.map(n => ({ id: n.id, type: n.type, x: n.x, y: n.y, state: n.state })),
                    edges: this.edges,
                    transform: App.canvas.transform
                };
            }

            loadJSON(data) {
                this.clear();
                if(data.transform) {
                    App.canvas.transform = data.transform;
                    App.canvas.updateTransform();
                }
                data.nodes.forEach(n => this.addNode(n.type, n.x, n.y, n.id, n.state));
                data.edges.forEach(e => this.addEdge(e.from, e.to));
            }

            triggerSave() {
                clearTimeout(this.saveTimer);
                this.saveTimer = setTimeout(() => Store.save(this.toJSON()), 500); // Debounce save
            }

            clear() {
                this.nodeLayer.innerHTML = '';
                this.svgLayer.innerHTML = '';
                this.nodes = [];
                this.edges = [];
                this.selectNode(null);
                Store.clear();
            }

            // --- Node Management ---
            addNode(type, x, y, forceId = null, loadedState = null) {
                const config = NODE_REGISTRY[type];
                if(!config) return;

                const id = forceId || 'n_' + generateId();
                // Deep copy initial state
                const state = loadedState || (config.state ? JSON.parse(JSON.stringify(config.state)) : {});
                
                const nodeObj = { id, type, x, y, config, state, element: null };
                
                // Build DOM
                const el = document.createElement('div');
                el.className = `node flex flex-col group`;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                el.dataset.id = id;

                let portsHtml = '';
                if(config.ports.includes('in')) portsHtml += `<div class="port port-in" data-dir="in" data-node="${id}"></div>`;
                if(config.ports.includes('out')) portsHtml += `<div class="port port-out" data-dir="out" data-node="${id}"></div>`;

                el.innerHTML = `
                    <div class="node-header p-2 bg-black/20 border-b border-zinc-700 flex items-center gap-2 rounded-t-lg">
                        <div class="w-3 h-3 rounded-full ${config.color}"></div>
                        <span class="font-medium text-sm flex-1 pointer-events-none">${config.title}</span>
                        <i class="ph ${config.icon} text-zinc-400 pointer-events-none"></i>
                    </div>
                    <div class="p-3 text-xs text-zinc-400 bg-zinc-800/50 rounded-b-lg min-h-[40px] pointer-events-none node-body">
                        ID: <span class="font-mono text-zinc-500">${id}</span>
                    </div>
                    ${portsHtml}
                `;

                nodeObj.element = el;
                this.nodeLayer.appendChild(el);
                this.nodes.push(nodeObj);
                
                this.setupNodeInteraction(nodeObj);
                this.triggerSave();
                return nodeObj;
            }

            removeNode(id) {
                // Remove connected edges
                this.edges = this.edges.filter(e => {
                    if(e.from === id || e.to === id) {
                        if(e.pathEl) e.pathEl.remove();
                        return false;
                    }
                    return true;
                });
                
                // Remove Node
                const idx = this.nodes.findIndex(n => n.id === id);
                if(idx > -1) {
                    this.nodes[idx].element.remove();
                    this.nodes.splice(idx, 1);
                }
                if(this.selectedNodeId === id) this.selectNode(null);
                
                this.updatePorts();
                this.triggerSave();
            }

            // --- Node Interactions ---
            setupNodeInteraction(node) {
                const header = node.element.querySelector('.node-header');
                
                // Dragging
                header.addEventListener('mousedown', (e) => {
                    if(e.button !== 0) return; // Only left click
                    e.stopPropagation();
                    this.selectNode(node.id);
                    this.draggingNode = node;
                    
                    // Calc offset in world space
                    const worldClick = App.canvas.screenToWorld(e.clientX, e.clientY);
                    this.dragOffset = { x: worldClick.x - node.x, y: worldClick.y - node.y };
                });

                // Ports
                const outPort = node.element.querySelector('.port-out');
                if(outPort) {
                    outPort.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        this.startWiring(node);
                    });
                }

                const inPort = node.element.querySelector('.port-in');
                if(inPort) {
                    inPort.addEventListener('mouseup', (e) => {
                        e.stopPropagation();
                        if(this.wiring.active && this.wiring.sourceNode.id !== node.id) {
                            this.addEdge(this.wiring.sourceNode.id, node.id);
                            this.endWiring();
                        }
                    });
                }
            }

            // --- Edge Management ---
            addEdge(fromId, toId) {
                // Prevent duplicates
                if(this.edges.find(e => e.from === fromId && e.to === toId)) return;
                
                // Prevent multi-inputs for simplicity (1 in, N out)
                const existingInput = this.edges.findIndex(e => e.to === toId);
                if(existingInput > -1) {
                    this.edges[existingInput].pathEl.remove();
                    this.edges.splice(existingInput, 1);
                }

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.classList.add('wire-path');
                this.svgLayer.appendChild(path);

                path.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.removeEdge(fromId, toId);
                });

                this.edges.push({ from: fromId, to: toId, pathEl: path });
                
                this.updateEdges();
                this.updatePorts();
                this.triggerSave();
            }

            removeEdge(fromId, toId) {
                const idx = this.edges.findIndex(e => e.from === fromId && e.to === toId);
                if(idx > -1) {
                    this.edges[idx].pathEl.remove();
                    this.edges.splice(idx, 1);
                    this.updatePorts();
                    this.triggerSave();
                }
            }

            startWiring(node) {
                this.wiring.active = true;
                this.wiring.sourceNode = node;
                
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.classList.add('wire-path');
                path.style.strokeDasharray = "5,5";
                this.svgLayer.appendChild(path);
                this.wiring.tempPath = path;
            }

            endWiring() {
                if(this.wiring.tempPath) this.wiring.tempPath.remove();
                this.wiring = { active: false, sourceNode: null, tempPath: null };
            }

            // --- Rendering Math ---
            updateEdges() {
                this.edges.forEach(edge => {
                    const fromNode = this.nodes.find(n => n.id === edge.from);
                    const toNode = this.nodes.find(n => n.id === edge.to);
                    if(fromNode && toNode) {
                        const pathString = this.calculateBezier(fromNode, toNode);
                        edge.pathEl.setAttribute('d', pathString);
                    }
                });
            }

            updatePorts() {
                // Reset all
                document.querySelectorAll('.port').forEach(p => p.classList.remove('connected'));
                // Apply active
                this.edges.forEach(e => {
                    const fromNode = this.nodes.find(n => n.id === e.from);
                    const toNode = this.nodes.find(n => n.id === e.to);
                    if(fromNode) fromNode.element.querySelector('.port-out').classList.add('connected');
                    if(toNode) toNode.element.querySelector('.port-in').classList.add('connected');
                });
            }

            calculateBezier(nodeA, nodeB, targetX=null, targetY=null) {
                // Get center of ports relative to workspace
                const w = 260; // Node width
                const h = nodeA.element.offsetHeight; // Approx height
                const hB = nodeB ? nodeB.element.offsetHeight : 0;

                const startX = nodeA.x + w; // Right side
                const startY = nodeA.y + h/2;
                
                const endX = nodeB ? nodeB.x : targetX;
                const endY = nodeB ? nodeB.y + hB/2 : targetY;

                const stiffness = 0.5;
                const cpOffset = Math.max(80, Math.abs(endX - startX) * stiffness);
                
                return `M ${startX} ${startY} C ${startX + cpOffset} ${startY}, ${endX - cpOffset} ${endY}, ${endX} ${endY}`;
            }

            // --- Global Bindings ---
            bindEvents() {
                // Drag Node / Draw Temp Wire
                window.addEventListener('mousemove', (e) => {
                    if(this.draggingNode) {
                        const world = App.canvas.screenToWorld(e.clientX, e.clientY);
                        // Grid snapping (snap to 20px)
                        const snap = 20;
                        this.draggingNode.x = Math.round((world.x - this.dragOffset.x) / snap) * snap;
                        this.draggingNode.y = Math.round((world.y - this.dragOffset.y) / snap) * snap;
                        
                        this.draggingNode.element.style.left = `${this.draggingNode.x}px`;
                        this.draggingNode.element.style.top = `${this.draggingNode.y}px`;
                        this.updateEdges();
                    }
                    
                    if(this.wiring.active && this.wiring.tempPath) {
                        const world = App.canvas.screenToWorld(e.clientX, e.clientY);
                        this.wiring.tempPath.setAttribute('d', this.calculateBezier(this.wiring.sourceNode, null, world.x, world.y));
                    }
                });

                window.addEventListener('mouseup', () => {
                    if(this.draggingNode) {
                        this.draggingNode = null;
                        this.triggerSave();
                    }
                    if(this.wiring.active) this.endWiring();
                });

                // Canvas click (deselect)
                document.getElementById('viewport').addEventListener('mousedown', (e) => {
                    if(e.target.id === 'viewport' || e.target.id === 'workspace' || e.target.id === 'svg-layer') {
                        this.selectNode(null);
                    }
                });
            }

            // --- Properties Inspector ---
            selectNode(id) {
                this.nodes.forEach(n => n.element.classList.remove('selected'));
                this.selectedNodeId = id;
                
                if(!id) {
                    this.propsContainer.innerHTML = '<div class="text-sm text-zinc-500 italic text-center mt-4">Select a node to inspect.</div>';
                    this.propId.textContent = '';
                    return;
                }

                const node = this.nodes.find(n => n.id === id);
                node.element.classList.add('selected');
                this.propId.textContent = id;
                
                // Render custom properties if defined
                if(node.config.renderProps) {
                    this.propsContainer.innerHTML = node.config.renderProps(node, 'App.updateNodeState');
                } else {
                    this.propsContainer.innerHTML = '<div class="text-xs text-zinc-500">No configurable properties for this node type.</div>';
                }
                
                // Add Delete button
                this.propsContainer.innerHTML += `
                    <div class="pt-4 mt-4 border-t border-zinc-700">
                        <button onclick="App.graph.removeNode('${id}')" class="w-full py-1.5 rounded border border-red-500/30 text-red-400 hover:bg-red-500/10 text-sm transition-colors">
                            Delete Node
                        </button>
                    </div>
                `;
            }
        }


        // --- 5. Execution Engine ---
        class ExecutionEngine {
            static async run(graph) {
                App.log('--- Execution Started ---', 'text-violet-400 font-bold mt-2');
                
                // Reset visuals
                graph.nodes.forEach(n => n.element.classList.remove('executing'));
                graph.edges.forEach(e => e.pathEl.classList.remove('executing'));

                // Find Triggers (Nodes with no inputs)
                const triggerNodes = graph.nodes.filter(n => graph.edges.every(e => e.to !== n.id));
                
                if(triggerNodes.length === 0) {
                    App.log('No valid entry points (triggers) found.', 'text-red-400');
                    return;
                }

                // Execute each flow path
                for(let startNode of triggerNodes) {
                    await this.traverse(startNode, graph, null);
                }
                
                App.log('--- Execution Complete ---', 'text-zinc-500 mb-2');
            }

            // Recursive traversal with simulated async delay for visual effect
            static async traverse(node, graph, inputData) {
                // Visual Pulse
                node.element.classList.add('executing');
                
                // Execute Node Logic
                let outputData = null;
                try {
                    outputData = node.config.execute(node, {}, inputData);
                } catch(err) {
                    App.log(`Error in node [${node.id}]: ${err.message}`, 'text-red-500');
                    node.element.classList.remove('executing');
                    return; // Stop flow on error
                }

                // Simulate processing time
                await new Promise(r => setTimeout(r, 600)); 
                node.element.classList.remove('executing');

                // Find outgoing edges
                const outEdges = graph.edges.filter(e => e.from === node.id);
                for(let edge of outEdges) {
                    edge.pathEl.classList.add('executing');
                    const nextNode = graph.nodes.find(n => n.id === edge.to);
                    
                    await new Promise(r => setTimeout(r, 400)); // Travel time
                    
                    if(nextNode) {
                        await this.traverse(nextNode, graph, outputData);
                    }
                    edge.pathEl.classList.remove('executing');
                }
            }
        }



        // --- 6. Global App Controller ---
        const App = {
            canvas: null,
            graph: null,
            
            init() {
                this.canvas = new CanvasController();
                this.graph = new GraphManager();
                
                this.buildLibrary();
                this.setupContextMenu();
                this.setupUI();
                
                // Attempt Load
                const savedData = Store.load();
                if(savedData && savedData.nodes.length > 0) {
                    this.graph.loadJSON(savedData);
                    this.log('Restored previous session.', 'text-zinc-400');
                } else {
                    // Default demo setup
                    setTimeout(() => this.setupDemo(), 100);
                }
            },

            buildLibrary() {
                const lib = document.getElementById('node-library');
                Object.keys(NODE_REGISTRY).forEach(type => {
                    const def = NODE_REGISTRY[type];
                    const el = document.createElement('div');
                    el.className = `p-2 rounded bg-zinc-800 border border-zinc-700 cursor-grab hover:border-accent transition-colors flex items-center gap-3`;
                    el.draggable = true;
                    el.innerHTML = `
                        <div class="w-6 h-6 rounded flex items-center justify-center ${def.color} bg-opacity-20">
                            <i class="ph ${def.icon} text-white"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-medium text-gray-200">${def.title}</div>
                            <div class="text-[10px] text-zinc-500 uppercase">${def.category}</div>
                        </div>
                    `;
                    
                    el.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('type', type);
                    });
                    
                    lib.appendChild(el);
                });

                // Canvas Drop Setup
                const vp = document.getElementById('viewport');
                vp.addEventListener('dragover', e => e.preventDefault());
                vp.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const type = e.dataTransfer.getData('type');
                    if(type) {
                        const world = this.canvas.screenToWorld(e.clientX, e.clientY);
                        this.graph.addNode(type, world.x - 130, world.y - 40); // Offset to center on mouse
                    }
                });
            },

            setupContextMenu() {
                const menu = document.getElementById('context-menu');
                let targetId = null;
                let clickPos = {x:0, y:0};

                window.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    targetId = null;
                    clickPos = { x: e.clientX, y: e.clientY };

                    // Check if clicked a node
                    const nodeEl = e.target.closest('.node');
                    
                    menu.innerHTML = '';
                    if(nodeEl) {
                        targetId = nodeEl.dataset.id;
                        menu.innerHTML = `
                            <div class="context-item text-red-400 hover:bg-red-500/20 hover:text-red-300" onclick="App.graph.removeNode('${targetId}'); document.getElementById('context-menu').style.display='none'">
                                <i class="ph ph-trash"></i> Delete Node
                            </div>
                        `;
                    } else {
                        // Canvas context menu
                        menu.innerHTML = `<div class="px-2 py-1 text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Add Node</div>`;
                        Object.keys(NODE_REGISTRY).forEach(type => {
                            const def = NODE_REGISTRY[type];
                            menu.innerHTML += `
                                <div class="context-item" onclick="App.addNodeFromContext('${type}', ${clickPos.x}, ${clickPos.y})">
                                    <i class="ph ${def.icon}"></i> ${def.title}
                                </div>
                            `;
                        });
                    }
                    
                    menu.style.display = 'block';
                    menu.style.left = `${e.clientX}px`;
                    menu.style.top = `${e.clientY}px`;
                });

                window.addEventListener('click', () => menu.style.display = 'none');
            },

            addNodeFromContext(type, screenX, screenY) {
                const world = this.canvas.screenToWorld(screenX, screenY);
                this.graph.addNode(type, world.x, world.y);
                document.getElementById('context-menu').style.display='none';
            },

            setupUI() {
                document.getElementById('btn-center').addEventListener('click', () => this.canvas.center());
                document.getElementById('btn-clear').addEventListener('click', () => {
                    this.graph.clear();
                    this.log('Canvas cleared.', 'text-zinc-500');
                });
                document.getElementById('btn-run').addEventListener('click', () => {
                    ExecutionEngine.run(this.graph);
                });
                document.getElementById('btn-clear-console').addEventListener('click', () => {
                    document.getElementById('console-output').innerHTML = '';
                });
            },

            updateNodeState(nodeId, key, value) {
                const node = this.graph.nodes.find(n => n.id === nodeId);
                if(node) {
                    node.state[key] = value;
                    this.graph.triggerSave();
                }
            },

            log(message, colorClass = 'text-zinc-300') {
                const consoleDiv = document.getElementById('console-output');
                const time = new Date().toLocaleTimeString([], {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
                const line = document.createElement('div');
                line.className = `flex gap-2 border-b border-white/5 pb-1 ${colorClass}`;
                line.innerHTML = `<span class="text-zinc-600 shrink-0">[${time}]</span> <span class="break-words">${message}</span>`;
                consoleDiv.appendChild(line);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            },

            setupDemo() {
                const t = this.graph.addNode('trigger', 100, 200);
                const n1 = this.graph.addNode('number', 100, 350);
                const m = this.graph.addNode('math', 450, 250);
                const l = this.graph.addNode('log', 800, 250);
                
                n1.state.value = 42;
                m.state.operation = 'multiply';
                m.state.factor = 10;

                setTimeout(() => {
                    this.graph.addEdge(n1.id, m.id);
                    this.graph.addEdge(m.id, l.id);
                }, 100); // Allow DOM layout
            }
        };

        // Boot
        window.addEventListener('DOMContentLoaded', () => App.init());

    </script>
</body>
</html>
